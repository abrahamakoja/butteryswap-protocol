[profile.default]
auto_detect_solc=true
# optimizer = true
# optimizer_runs = 50
src = "src"
out = "out"
libs = ["lib"]
ffi = true
ast = true
offline=true
build_info = true
bytecode_hash = "none"
extra_output = ["storageLayout"]
fs_permissions = [{ access = "read", path = "/"}]
cache = true
cache_path = 'cache'
broadcast = 'broadcast'


# @audit remove in production
[profile.solx]
# solc_version = "/home/oxAkoja/.local/bin/solx"
offline=true
auto_detect_solc=true
# via_ir = true

[fuzz]
runs = 1000
show_metrics = true
fail_on_revert = true
max_test_rejects = 65536

[invariant]
runs = 128
depth = 128
show_metrics = true
fail_on_revert = true
show_progress = true


[rpc_endpoints]
mainnet = "${MAINNET_RPC_URL}"


# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
