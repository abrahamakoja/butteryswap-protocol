[profile.default]
optimizer = true
optimizer_runs = 200
src = "src"
out = "out"
libs = ["lib"]
ffi = true
ast = true
offline=true
build_info = true
auto_detect_solc=true
extra_output = ["storageLayout"]
fs_permissions = [{ access = "read", path = "./"}]
# fs_permissions = [{ access = "read", path = "./broadcast" },{ access = "read", path = "out" }]
cache = true
cache_path = 'cache'
broadcast = 'broadcast'
# remappings = 'remappings.txt'

# remove in production
[profile.solx]
solc_version = "/home/oxAkoja/.local/bin/solx"


[fuzz]
runs = 1000
show_metrics = true
fail_on_revert = true
max_test_rejects = 65536

[invariant]
runs = 128
depth = 128
show_metrics = true
fail_on_revert = true
show_progress = true


# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
